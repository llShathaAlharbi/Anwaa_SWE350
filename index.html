<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>أنواء | تراث العرب في النجوم</title>
    <meta name="description" content="تطبيق أنواء: استكشاف تراث العرب في النجوم ومنازل القمر مع خريطة سماوية حقيقية ومساعد ذكي من أمهات المصادر التراثية." />
    <meta property="og:title" content="أنواء | تراث العرب في النجوم" />
    <meta property="og:description" content="تطبيق أنواء: استكشاف تراث العرب في النجوم ومنازل القمر مع خريطة سماوية حقيقية ومساعد ذكي من أمهات المصادر التراثية." />
    <script>
      (function () {
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('anwaa_theme');
          if (saved === 'light' || saved === 'dark') {
            theme = saved;
          } else if (
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: light)').matches
          ) {
            theme = 'light';
          }
        } catch (e) {
          if (
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: light)').matches
          ) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/fonts.css">
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body class="bg-[var(--bg)] text-[var(--ink)] antialiased m-0 p-0">
    <div id="root" class="min-h-screen flex flex-col w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
